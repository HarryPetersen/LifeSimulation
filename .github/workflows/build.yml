name: Build and test
on: [push, pull_request]

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitizer: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DLIFE_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLIFE_ENABLE_SANITIZERS=${{ matrix.sanitizer }}
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxrandr-dev libxcursor-dev libxi-dev libudev-dev libfreetype6-dev libflac-dev libvorbis-dev libgl1-mesa-dev
      - run: git clone --depth 1 --branch 3.0.2 https://github.com/SFML/SFML.git /tmp/sfml
      - run: cmake -S /tmp/sfml -B /tmp/sfml-build -DBUILD_SHARED_LIBS=ON -DSFML_BUILD_AUDIO=OFF -DSFML_BUILD_NETWORK=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/sfml-install
      - run: cmake --build /tmp/sfml-build --parallel 2 && cmake --install /tmp/sfml-build
      - run: cmake -S . -B build -DCMAKE_PREFIX_PATH=/tmp/sfml-install -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
